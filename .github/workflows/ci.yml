name: Verify scanner
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q terra_cpr
      - run: strength-tracker demo --output /tmp/strength-tracker-demo
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[test-browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg STRENGTH_TRACKER_REVISION=${{ github.sha }} -t strength-tracker:test .
      - run: docker run --rm strength-tracker:test python -m terra_cpr.cli demo --output /tmp/demo
