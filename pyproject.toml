[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strength-tracker"
version = "0.1.0"
description = "Research-first beta-adjusted relative-strength and market-structure tracker"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test-browser = ["playwright>=1.55,<2"]

[project.scripts]
strength-tracker = "terra_cpr.cli:main"
# Backward-compatible command name; the Python package is also intentionally
# unchanged so existing configs and imports keep working.
terra-cpr = "terra_cpr.cli:main"

[tool.setuptools.packages.find]
include = ["terra_cpr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
